# Скопируйте в agent.toml рядом с aipanel-agent(.exe) или передайте путь через --config.
# server, token и name можно задать и переменными AIPANEL_SERVER, AIPANEL_TOKEN, AIPANEL_NAME.

# Адрес панели. Вне localhost используйте wss:// (HTTPS), иначе токен уйдёт открытым текстом.
server = "wss://panel.example.com/agent"

# Значение token этого пользователя из PANEL_USERS в .env сервера.
token = ""

# Имя этой машины в панели. По умолчанию — имя хоста.
#name = "home-pc"

# Профиль Windows Terminal (имя или guid) для окон, которые открывает агент: цветовая схема,
# шрифт и прочее берутся из него. По умолчанию — профиль по умолчанию из настроек Windows Terminal.
#terminal_profile = "PowerShell"

[claude]
enabled = true
# Исполняемый файл Claude Code для продолжения закрытых сессий.
bin = "claude"
# Закрытые сессии: изменённые за последние N дней, не больше max_recent штук.
recent_days = 7
max_recent = 30
# Дополнительные аргументы при запуске закрытой сессии: в Windows это окно консоли
# `claude --resume <id> ...`, на других системах фоновый `claude -p --resume <id>`.
# Например, режим разрешений:
#resume_args = ["--permission-mode", "acceptEdits"]
resume_args = []

# Отмечать каталог доверенным в ~/.claude.json перед открытием нового окна. Claude Code
# в незнакомом каталоге сначала спрашивает «Is this a project you created or one you
# trust?» и до ответа не заводит сессию: окно стоит на вопросе, а сессии в панели нет.
# Из панели, особенно с телефона, ответить нечем — поэтому флаг включает отметку.
#trust_dirs = true
trust_dirs = false

[opencode]
enabled = true
# Программа для открытия окна неактивной сессии. Если её нет в PATH, ищется ~/.opencode/bin.
bin = "opencode"
# Модель для сообщений из панели. Без этого сообщение уходит на модель, сохранённую в сессии
# (или на умолчание сервера), а не на ту, что видна в строке состояния окна.
#   "auto"    — последняя модель, выбранная в окне opencode (по умолчанию)
#   "session" — не менять модель сессии
#   "провайдер/модель" — явная модель, например "opencode-go/deepseek-v4.1-flash"
model = "auto"
max_sessions = 30
# Адрес и пароль сервиса opencode. По умолчанию берутся из ~/.local/state/opencode/service.json.
#url = "http://127.0.0.1:4096"
#password = ""
