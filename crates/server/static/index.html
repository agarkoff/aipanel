<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f2023" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>AiPanel</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/app.webmanifest">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<form id="login" class="login" hidden>
  <h1><img class="logo" src="/icon.svg" alt="" width="30" height="30">AiPanel</h1>
  <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
  <button type="submit">Войти</button>
  <p id="login-error" class="error"></p>
</form>

<div id="app" class="app" hidden>
  <aside id="sidebar" class="sidebar">
    <header>
      <img class="logo" src="/icon.svg" alt="" width="20" height="20">
      <strong>AiPanel</strong>
      <span id="conn" class="conn" title="Соединение с сервером"></span>
      <button id="new-session" class="new-session" type="button" title="Новая сессия" aria-label="Новая сессия">+</button>
      <span id="user" class="user" hidden></span>
      <button id="logout" class="link" type="button">Выйти</button>
    </header>
    <input id="filter" class="filter" type="search" placeholder="Фильтр по названию или каталогу">
    <div id="sessions" class="sessions"></div>
    <p id="hint-list" class="hint hint-list"></p>
  </aside>

  <main class="main">
    <header class="top">
      <button id="back" class="link back" type="button" aria-label="К списку сессий">←</button>
      <div class="titles">
        <div id="title" class="title">Выберите сессию</div>
        <div class="subtitle">
          <span id="subtitle"></span>
          <code id="session-id" class="session-id" hidden></code>
          <button id="copy-id" class="copy-id" type="button" aria-label="Скопировать идентификатор сессии" title="Скопировать идентификатор" hidden>
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4">
              <rect x="5.5" y="5.5" width="8" height="8" rx="1.5"></rect>
              <path d="M10.5 3.5V3A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"></path>
            </svg>
          </button>
        </div>
      </div>
      <span id="status" class="badge" hidden></span>
      <button id="handoff" type="button" aria-label="Продолжить в другом инструменте" hidden><span class="icon">⇄</span><span class="label">В другой агент</span></button>
      <button id="interrupt" class="danger" type="button" aria-label="Прервать" hidden><span class="icon">■</span><span class="label">Прервать</span></button>
    </header>
    <button id="pin" class="pin" type="button" hidden title="Перейти к закреплённому сообщению; следующее нажатие ведёт к более старому">
      <svg class="pin-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.2 2h3.6l-.5 4 2.2 2.4H4.5L6.7 6z"></path>
        <path d="M8 8.4V14"></path>
      </svg>
      <span class="pin-body">
        <span class="pin-title">Закреплено</span>
        <span id="pin-preview" class="pin-preview"></span>
      </span>
      <span id="pin-count" class="pin-count" hidden></span>
    </button>
    <div class="feed-wrap">
      <div id="feed" class="feed"></div>
      <button id="to-end" class="to-end" type="button" hidden aria-label="В конец переписки" title="В конец переписки">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3v10"></path>
          <path d="M3.5 8.5 8 13l4.5-4.5"></path>
        </svg>
      </button>
    </div>
    <div id="prompts" class="prompts" role="region" aria-label="Запросы opencode" aria-live="polite"></div>
    <form id="composer" class="composer" hidden>
      <textarea id="text" rows="1" placeholder="Сообщение в сессию"></textarea>
      <button type="submit" aria-label="Отправить"><span class="icon">↑</span><span class="label">Отправить</span></button>
    </form>
    <p id="hint" class="hint"></p>
  </main>
</div>

<dialog id="launch" class="launch" aria-labelledby="launch-title">
  <form id="launch-form">
    <h2 id="launch-title">Новая сессия</h2>
    <label>Инструмент
      <select id="launch-tool">
        <option value="claude">Claude Code</option>
        <option value="opencode">opencode</option>
      </select>
    </label>
    <label id="launch-agent-row">Компьютер
      <select id="launch-agent"></select>
    </label>
    <label>Каталог
      <input id="launch-cwd" placeholder="Абсолютный путь к папке" autocomplete="off" spellcheck="false" required>
    </label>
    <p id="launch-hint" class="hint"></p>
    <div class="actions">
      <button id="launch-cancel" class="link" type="button">Отмена</button>
      <button id="launch-ok" type="submit">Запустить</button>
    </div>
  </form>
</dialog>

<script src="/md.js"></script>
<script src="/suggest.js"></script>
<script src="/app.js"></script>
</body>
</html>
