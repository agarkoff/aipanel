<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f2023" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>AiPanel</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/app.webmanifest">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<form id="login" class="login" hidden>
  <h1><img class="logo" src="/icon.svg" alt="" width="30" height="30">AiPanel</h1>
  <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
  <button type="submit">Войти</button>
  <p id="login-error" class="error"></p>
</form>

<div id="app" class="app" hidden>
  <aside id="sidebar" class="sidebar">
    <header>
      <button id="shots" class="logo-btn" type="button" title="Снимок экрана" aria-label="Снимок экрана">
        <img class="logo" src="/icon.svg" alt="" width="20" height="20">
      </button>
      <strong>AiPanel</strong>
      <span id="conn" class="conn" title="Соединение с сервером"></span>
      <button id="new-session" class="new-session" type="button" title="Новая сессия" aria-label="Новая сессия">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M8 5v6"></path>
          <path d="M5 8h6"></path>
        </svg>
      </button>
      <span id="user" class="who" hidden></span>
      <button id="push" class="push-btn" type="button" aria-label="Уведомления на этом устройстве" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
          <path class="push-slash" d="M3 3l18 18"/>
        </svg>
      </button>
      <button id="logout" class="link" type="button">Выйти</button>
    </header>
    <input id="filter" class="filter" type="search" placeholder="Фильтр по названию или каталогу">
    <div id="sessions" class="sessions"></div>
    <p id="hint-list" class="hint hint-list"></p>
  </aside>

  <main class="main">
    <header class="top">
      <button id="back" class="link back" type="button" aria-label="К списку сессий">←</button>
      <div class="titles">
        <div class="title-line">
          <div id="title" class="title">Выберите сессию</div>
          <button id="rename" class="rename-btn" type="button" aria-label="Переименовать сессию" title="Переименовать сессию" hidden>
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.6 2.4 13.6 5.4 5.6 13.4 2 14 2.6 10.4z"></path>
            </svg>
          </button>
        </div>
        <div class="subtitle">
          <span id="subtitle"></span>
          <code id="session-id" class="session-id" hidden></code>
          <button id="copy-id" class="copy-id" type="button" aria-label="Скопировать идентификатор сессии" title="Скопировать идентификатор" hidden>
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4">
              <rect x="5.5" y="5.5" width="8" height="8" rx="1.5"></rect>
              <path d="M10.5 3.5V3A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"></path>
            </svg>
          </button>
        </div>
      </div>
      <button id="favorites" class="favorites" type="button" aria-label="Избранное" title="Избранное" aria-expanded="false" aria-controls="favorites-menu" hidden>
        <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round">
          <path d="M8 2L9.5 6.1L13.9 6.3L10.5 9L11.6 13.2L8 10.8L4.4 13.2L5.5 9L2.1 6.3L6.5 6.1Z"></path>
        </svg>
        <span id="favorites-count" class="fav-count" hidden></span>
      </button>
      <div id="favorites-menu" class="session-menu fav-menu" hidden>
        <div class="fav-head">Избранное</div>
        <div id="favorites-list" class="fav-list"></div>
      </div>
      <span id="status" class="badge" hidden></span>
      <button id="handoff" type="button" aria-label="Продолжить в другом инструменте" hidden><span class="icon">⇄</span><span class="label">В другой агент</span></button>
      <button id="interrupt" class="danger" type="button" aria-label="Прервать" hidden><span class="icon">■</span><span class="label">Прервать</span></button>
      <button id="more" class="more" type="button" aria-label="Модель, лимиты и действия с сессией" aria-expanded="false" aria-controls="session-menu" hidden>
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 6 8 10.5 12.5 6"></path>
        </svg>
      </button>
      <div id="session-menu" class="session-menu" hidden>
        <div class="sm-row">
          <span class="sm-key">Модель</span>
          <span id="sm-model" class="sm-model"></span>
        </div>
        <div id="sm-limits-row" class="sm-row">
          <span class="sm-key">Осталось лимита</span>
          <div id="sm-limits" class="sm-limits"></div>
        </div>
        <div class="sm-row">
          <span class="sm-key">Сессия</span>
          <button id="sm-id" class="sm-id" type="button" aria-label="Скопировать идентификатор сессии" title="Скопировать идентификатор">
            <code id="sm-id-text"></code>
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4">
              <rect x="5.5" y="5.5" width="8" height="8" rx="1.5"></rect>
              <path d="M10.5 3.5V3A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"></path>
            </svg>
          </button>
        </div>
        <button id="sm-handoff" type="button" hidden></button>
      </div>
    </header>
    <button id="pin" class="pin" type="button" hidden title="Перейти к закреплённому сообщению; следующее нажатие ведёт к более старому">
      <svg class="pin-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.2 2h3.6l-.5 4 2.2 2.4H4.5L6.7 6z"></path>
        <path d="M8 8.4V14"></path>
      </svg>
      <span class="pin-body">
        <span class="pin-title">Закреплено</span>
        <span id="pin-preview" class="pin-preview"></span>
      </span>
      <span id="pin-count" class="pin-count" hidden></span>
    </button>
    <div class="feed-wrap">
      <div id="feed" class="feed">
        <button id="older" class="older" type="button" hidden>Загрузить ранние сообщения</button>
      </div>
      <button id="to-end" class="to-end" type="button" hidden aria-label="В конец переписки" title="В конец переписки">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3v10"></path>
          <path d="M3.5 8.5 8 13l4.5-4.5"></path>
        </svg>
      </button>
    </div>
    <p id="turn" class="turn" hidden></p>
    <div id="prompts" class="prompts" role="region" aria-label="Запросы opencode" aria-live="polite"></div>
    <form id="composer" class="composer" hidden>
      <textarea id="text" rows="1" placeholder="Сообщение в сессию"></textarea>
      <button type="submit" aria-label="Отправить"><span class="icon">↑</span><span class="label">Отправить</span></button>
    </form>
    <p id="hint" class="hint"></p>
  </main>
</div>

<dialog id="launch" class="launch" aria-labelledby="launch-title">
  <form id="launch-form">
    <h2 id="launch-title">Новая сессия</h2>
    <label>Инструмент
      <select id="launch-tool">
        <option value="claude">Claude Code</option>
        <option value="opencode">opencode</option>
      </select>
    </label>
    <label>Модель
      <input id="launch-model" placeholder="Выберите модель из списка" autocomplete="off" spellcheck="false">
    </label>
    <label id="launch-agent-row">Компьютер
      <select id="launch-agent"></select>
    </label>
    <div class="field">
      <label for="launch-cwd">Каталог</label>
      <div class="path-field">
        <input id="launch-cwd" placeholder="Абсолютный путь к папке" autocomplete="off" spellcheck="false" required>
        <button id="launch-browse" class="browse" type="button" aria-expanded="false" aria-controls="launch-tree">Обзор…</button>
      </div>
      <div id="launch-tree" class="tree" role="tree" aria-label="Каталоги" hidden></div>
    </div>
    <p id="launch-hint" class="hint"></p>
    <div class="actions">
      <button id="launch-cancel" class="link" type="button">Отмена</button>
      <button id="launch-ok" type="submit">Запустить</button>
    </div>
  </form>
</dialog>

<dialog id="mkdir" class="launch confirm" aria-labelledby="mkdir-title">
  <form id="mkdir-form">
    <h2 id="mkdir-title">Каталога нет</h2>
    <p id="mkdir-text" class="confirm-text"></p>
    <p id="mkdir-hint" class="hint"></p>
    <div class="actions">
      <button id="mkdir-cancel" class="link" type="button">Отмена</button>
      <button id="mkdir-ok" type="submit">Создать каталог</button>
    </div>
  </form>
</dialog>

<dialog id="delete-session" class="launch confirm" aria-labelledby="delete-title">
  <form id="delete-form">
    <h2 id="delete-title">Удалить сессию?</h2>
    <p id="delete-text" class="confirm-text"></p>
    <label class="check"><input id="delete-close" type="checkbox" checked> Закрыть сессию, если активна</label>
    <p id="delete-hint" class="hint"></p>
    <div class="actions">
      <button id="delete-cancel" class="link" type="button">Отмена</button>
      <button id="delete-ok" class="danger" type="submit">Удалить</button>
    </div>
  </form>
</dialog>

<dialog id="models" class="launch models" aria-labelledby="models-title">
  <form id="models-form">
    <h2 id="models-title">Модель сессии</h2>
    <input id="models-filter" type="search" placeholder="Название или провайдер" autocomplete="off" spellcheck="false">
    <div id="models-list" class="models-list" role="listbox" aria-label="Модели"></div>
    <p id="models-hint" class="hint"></p>
    <div class="actions">
      <button id="models-cancel" class="link" type="button">Закрыть</button>
    </div>
  </form>
</dialog>

<dialog id="shot-agent" class="launch confirm" aria-labelledby="shot-agent-title">
  <form id="shot-agent-form">
    <h2 id="shot-agent-title">Чей экран снять</h2>
    <p class="confirm-text">Открыта не сессия, а список, а компьютеров в сети несколько.</p>
    <div id="shot-agent-list" class="models-list" role="listbox" aria-label="Компьютеры"></div>
    <div class="actions">
      <button id="shot-agent-cancel" class="link" type="button">Отмена</button>
    </div>
  </form>
</dialog>

<dialog id="shot" class="shot" aria-label="Снимок экрана">
  <div class="shot-head">
    <span id="shot-label" class="shot-label"></span>
    <span id="shot-dots" class="shot-dots"></span>
    <button id="shot-refresh" class="shot-btn" type="button" title="Снять экран заново">Обновить</button>
    <button id="shot-close" class="shot-btn shot-x" type="button" aria-label="Закрыть снимок" title="Закрыть">
      <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M5 5l6 6"></path>
        <path d="M11 5l-6 6"></path>
      </svg>
    </button>
  </div>
  <div id="shot-stage" class="shot-stage">
    <div id="shot-strip" class="shot-strip"></div>
    <button id="shot-prev" class="shot-nav prev" type="button" aria-label="Предыдущий экран" title="Предыдущий экран" hidden>
      <svg viewBox="0 0 16 16" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.25 3.5 5.75 8l4.5 4.5"></path>
      </svg>
    </button>
    <button id="shot-next" class="shot-nav next" type="button" aria-label="Следующий экран" title="Следующий экран" hidden>
      <svg viewBox="0 0 16 16" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5.75 3.5 10.25 8l-4.5 4.5"></path>
      </svg>
    </button>
  </div>
  <p id="shot-hint" class="shot-hint"></p>
</dialog>

<script src="/hl.js"></script>
<script src="/md.js"></script>
<script src="/suggest.js"></script>
<!-- Панель собрана из частей: порядок скриптов важен — каждая часть видит
     объявления предыдущих и дополняет общее состояние из app.core.js. -->
<script src="/app.core.js"></script>
<script src="/app.boot.js"></script>
<script src="/app.sessions.js"></script>
<script src="/app.notify.js"></script>
<script src="/app.push.js"></script>
<script src="/app.feed.js"></script>
<script src="/app.favorites.js"></script>
<script src="/app.paging.js"></script>
<script src="/app.prompts.js"></script>
<script src="/app.launch-tree.js"></script>
<script src="/app.launch.js"></script>
<script src="/app.commands.js"></script>
<script src="/app.composer.js"></script>
<script src="/app.shots.js"></script>
<script src="/app.main.js"></script>
</body>
</html>
