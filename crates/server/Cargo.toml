[package]
name = "aipanel-server"
version.workspace = true
edition.workspace = true

[dependencies]
aipanel-proto = { path = "../proto" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
# Web Push: шифрование уведомления (RFC 8291) и подпись VAPID (RFC 8292).
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "std"] }
hkdf = "0.12"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Исходящий HTTPS к push-службам. Корневые сертификаты встроены (webpki-roots):
# образ собран FROM scratch, системных сертификатов в нём нет.
ureq = "2"
