[package]
name = "aipanel-agent"
version.workspace = true
edition.workspace = true

[dependencies]
aipanel-proto = { path = "../proto" }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "process", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Голосовой ввод: GigaAM v3 на ONNX Runtime, считает на CPU.
# `quantize` выключен — он нужен только сборщику моделей и требует `protoc`,
# которого на машинах с агентом нет; `async-pool` не нужен: движок работает
# в отдельном потоке и берёт сессию блокирующим `checkout_blocking`.
gigastt-core = { version = "2.22", default-features = false, features = ["net", "file-decode"] }

[build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
png = "0.17"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
